[project]
name = "swecc-mesocosm"
version = "0.1.0"
description = "SWECC Bench CLI — installable from the mesocosm repo; talks to api.swecc.org/bench by default."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "swecc-jwt @ git+https://github.com/swecc-uw/swecc-core.git@main#subdirectory=packages/swecc-jwt",
    "bench-common @ git+https://github.com/swecc-uw/swecc-core.git@main#subdirectory=services/bench/common",
]

[project.scripts]
bench = "bench_common.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swecc_bench_cli"]
